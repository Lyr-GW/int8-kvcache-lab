[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "int8-kvcache-lab"
version = "0.1.0"
description = "Colab-friendly dynamic INT8 KV-cache attention lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4,<2.7",
  "transformers==4.48.3",
  "datasets==3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]
# Do not add vLLM here: vLLM 0.6.6 pins a different Torch stack.  The optional
# capture runtime is installed by scripts/install_vllm_capture.sh instead.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
